<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, Helvetica, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #7b2ff7,
                    #f107a3
                );
        }


        /* LOGIN CONTAINER */

        .login-container {

            width: 400px;

            padding: 40px;

            background: white;

            border-radius: 20px;

            box-shadow:
                0 20px 50px
                rgba(0, 0, 0, 0.25);

        }


        /* TITLE */

        .login-container h1 {

            text-align: center;

            margin-bottom: 10px;

            color: #333;

        }

        .login-container p {

            text-align: center;

            color: #777;

            margin-bottom: 30px;

        }


        /* INPUT GROUP */

        .input-group {

            margin-bottom: 20px;

        }

        .input-group label {

            display: block;

            margin-bottom: 8px;

            font-weight: bold;

            color: #333;

        }

        .input-group input {

            width: 100%;

            padding: 13px 15px;

            border: 1px solid #ddd;

            border-radius: 10px;

            outline: none;

            font-size: 15px;

            transition: 0.3s;

        }


        /* INPUT HOVER / FOCUS */

        .input-group input:focus {

            border-color: #7b2ff7;

            box-shadow:
                0 0 8px
                rgba(123, 47, 247, 0.2);

        }


        /* LOGIN BUTTON */

        .login-button {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 30px;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            background:
                linear-gradient(
                    135deg,
                    #7b2ff7,
                    #f107a3
                );

            transition: 0.3s;

        }

        .login-button:hover {

            transform: translateY(-3px);

            box-shadow:
                0 10px 25px
                rgba(123, 47, 247, 0.35);

        }


        /* BACK BUTTON */

        .back {

            display: block;

            text-align: center;

            margin-top: 20px;

            color: #7b2ff7;

            text-decoration: none;

            font-weight: bold;

        }

        .back:hover {

            text-decoration: underline;

        }


        /* RESPONSIVE */

        @media (max-width: 500px) {

            .login-container {

                width: 90%;

                padding: 30px;

            }

        }

    </style>

</head>


<body>


    <div class="login-container">

        <h1>Welcome Back!</h1>

        <p>Login to continue</p>


        <form>

            <div class="input-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="input-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-button">

                Login

            </button>

        </form>


        <a href="index.html" class="back">
            ← Back to Home
        </a>

    </div>


</body>

</html>
