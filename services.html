
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Services</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
        }

        header {
            background: #222;
            padding: 20px;
            text-align: center;
        }

        header a {
            color: white;
            text-decoration: none;
            margin: 0 20px;
        }

        .content {
            padding: 80px 20px;
            text-align: center;
        }

        h1 {
            font-size: 45px;
            color: #7b2ff7;
            margin-bottom: 40px;
        }

        .services {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
        }

        .card {
            width: 250px;
            padding: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-10px);
        }

        .card h2 {
            color: #7b2ff7;
            margin-bottom: 15px;
        }

        .card p {
            color: #666;
            line-height: 1.6;
        }

    </style>

</head>

<body>

    <header>

        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="services.html">Services</a>
        <a href="products.html">Products</a>
        <a href="contact.html">Contact</a>

    </header>


    <section class="content">

        <h1>Our Services</h1>

        <div class="services">

            <div class="card">

                <h2>Web Design</h2>

                <p>
                    Modern and responsive website
                    design for all devices.
                </p>

            </div>


            <div class="card">

                <h2>Development</h2>

                <p>
                    Building fast and interactive
                    web applications.
                </p>

            </div>


            <div class="card">

                <h2>Support</h2>

                <p>
                    Professional support and
                    maintenance services.
                </p>

            </div>

        </div>

    </section>

</body>
</html>
